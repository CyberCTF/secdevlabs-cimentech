# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Cimentech (secDevLabs, by Globo.com) as an Isoloom spec: a company site on Drupal 7.57, a
# component with known vulnerabilities, and its PostgreSQL machine (a9db, the host name the
# site's settings use). Vendored unchanged from the app folder owasp-top10-2021-apps/a6/cimentech
# of secDevLabs (build/drupal/app/, build/a9db/app/, the rest in app/).
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: secdevlabs-cimentech

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.104.0/24, internet: false}

machines:
  a9db:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {data: /var/lib/postgresql/data}
    ports:
      postgres:
        port: 5432
    app:
      build: build/a9db
  drupal:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [a9db]
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/drupal

checks:
  - name: the site answers
    http: http://drupal/
    wait: 180
  - name: the Cimentech site runs Drupal 7.57
    script: checks/drupal.sh
    wait: 60

message: |
  Cimentech answers at {{ machines.drupal.ports.web.url }}. Find out
  what it is built with, and which version.
