# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: secdevlabs-cimentech
services:
  a9db:
    build:
      context: ../../build/a9db
    image: isoloom/secdevlabs-cimentech-a9db
    platform: linux/amd64
    hostname: a9db
    networks:
      lab:
        ipv4_address: 10.60.104.20
    volumes:
    - a9db-data:/var/lib/postgresql/data
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 5432
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.postgres: tcp:5432
    restart: unless-stopped
  a9db-routes:
    image: alpine:3.20
    network_mode: service:a9db
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      a9db:
        condition: service_started
    restart: unless-stopped
  drupal:
    build:
      context: ../../build/drupal
    image: isoloom/secdevlabs-cimentech-drupal
    platform: linux/amd64
    hostname: drupal
    networks:
      lab:
        ipv4_address: 10.60.104.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+80}:80
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      a9db:
        condition: service_healthy
      a9db-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:80
    restart: unless-stopped
  drupal-routes:
    image: alpine:3.20
    network_mode: service:drupal
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      drupal:
        condition: service_started
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      a9db:
        condition: service_healthy
      a9db-routes:
        condition: service_healthy
      drupal:
        condition: service_healthy
      drupal-routes:
        condition: service_healthy
  isoloom-check-a9db:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/a9db.sh:/isoloom/run.sh:ro
    network_mode: service:a9db
    depends_on:
      a9db:
        condition: service_healthy
      a9db-routes:
        condition: service_healthy
      drupal:
        condition: service_healthy
      drupal-routes:
        condition: service_healthy
  isoloom-check-drupal:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/drupal.sh:/isoloom/run.sh:ro
    network_mode: service:drupal
    depends_on:
      a9db:
        condition: service_healthy
      a9db-routes:
        condition: service_healthy
      drupal:
        condition: service_healthy
      drupal-routes:
        condition: service_healthy
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.104.0/24
        gateway: 10.60.104.1
volumes:
  a9db-data: {}
  isoloom-probe-amd64: {}
